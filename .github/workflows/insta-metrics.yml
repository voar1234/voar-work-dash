name: 아가노트 지표 동기화

on:
  schedule:
    - cron: '0 23,4,13 * * *'   # KST 08시 · 13시 · 22시
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 지표 가져오기
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_VERSION: v21.0
        run: python _sync_insta_metrics.py
